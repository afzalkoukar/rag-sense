services:
  rag-backend:
    container_name: rag-app
    build: .
    
    # Standard bridge mode (Safest for connectivity)
    ports:
      - "8000:8000"
    
    env_file:
      - .env
    
    # FIX 1: Force logs to show immediately (No buffering)
    environment:
      - PYTHONUNBUFFERED=1
    
    # FIX 2: Use Google DNS to ensure we can reach Gemini API
    dns:
      - 8.8.8.8
      - 8.8.4.4
    
    volumes:
      - .:/app
      
    # CHANGED: Updated to "app.main:app" to match new folder structure
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload